name: Cleanup

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  preview:
    name: Preview deletions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Preview resources
        shell: pwsh
        run: ./scripts/cleanup.ps1 -EnvironmentSuffix dev -WhatIf

  destroy:
    name: Delete resource groups
    needs: preview
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Azure Login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Delete resource groups
        shell: pwsh
        run: ./scripts/cleanup.ps1 -EnvironmentSuffix dev -Force
