# Development overrides. All unspecified values are inherited from core.yaml.

variables:
  environmentSuffix: dev # Environment token used in names and tags; allowed value in this file: dev.
  baseName: aifp # Short lowercase naming prefix; 1-10 alphanumeric characters, kept short for the 24-character storage-name limit.

  skuName: Standard_LRS # Storage redundancy SKU; allowed values: Standard_LRS, Standard_GRS, Standard_ZRS.
  modelSkuName: GlobalStandard # Primary model deployment SKU; commonly GlobalStandard, DataZoneStandard, or Standard when supported.
  secondaryModelSkuName: GlobalStandard # Secondary model deployment SKU; must be supported by the selected model and region.
  capacityK: 10 # Primary model throughput in thousands of tokens per minute; allowed value depends on model/SKU quota.
  secondaryCapacityK: 8 # Secondary model throughput in thousands of tokens per minute; allowed value depends on model/SKU quota.

  vmSize: Standard_L2as_v4 # Azure VM SKU; must be available in swedencentral and support Spot because vmUseSpot is true.
  vmImageSku: win11-24h2-ent-cpc-m365 # Marketplace image SKU used with the shared publisher, offer, and version.
  vmOsDiskStorageAccountType: Standard_LRS # Managed OS disk SKU; allowed values: Standard_LRS, StandardSSD_LRS, Premium_LRS.
  vmUseSpot: true # Uses interruptible Spot capacity for lower cost; allowed values: true, false.

  tagEnvironment: dev # Value for the environment resource tag; normally matches environmentSuffix.

  adminObjectIds: 'c88937f1-a8cb-4fb6-a072-9a88a020160c' # Comma-separated Entra object IDs granted deployment administration roles; one or more GUIDs.
  serviceConnection: '<REPLACE_WITH_SERVICE_CONNECTION_NAME>' # Azure DevOps service connection used by pipelines; ignored by local deploy.ps1.
