parameters:
  - name: environment
    displayName: Environment
    type: string
    default: dev
    values:
      - dev
      - uat

trigger: none
pr: none

variables:
  - template: ../variables/${{ parameters.environment }}.yaml

stages:
  - stage: Preview
    displayName: Preview resources
    jobs:
      - job: Preview
        displayName: Preview deletions
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: AzureCLI@2
            displayName: Preview cleanup
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: pscore
              scriptLocation: scriptPath
              scriptPath: scripts/cleanup.ps1
              arguments: -EnvironmentSuffix ${{ parameters.environment }} -WhatIf

  - stage: Destroy
    displayName: Destroy resources
    dependsOn: Preview
    jobs:
      - job: Destroy
        displayName: Delete resource groups
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: AzureCLI@2
            displayName: Delete resource groups
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: pscore
              scriptLocation: scriptPath
              scriptPath: scripts/cleanup.ps1
              arguments: -EnvironmentSuffix ${{ parameters.environment }} -Force
