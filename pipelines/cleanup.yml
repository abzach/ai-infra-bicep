parameters:
  - name: environment
    displayName: Environment
    type: string
    default: dev
    values:
      - dev
      - uat

trigger: none
pr: none

variables:
  # variables/*.yaml is intentionally untracked, so pipeline variables come from a variable
  # group named ai-infra-<environment> (see pipelines/README.md).
  - group: ai-infra-${{ parameters.environment }}

stages:
  - stage: Preview
    displayName: Preview resources
    jobs:
      - job: Preview
        displayName: Preview deletions
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: AzureCLI@2
            displayName: Preview cleanup
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: pscore
              scriptLocation: scriptPath
              scriptPath: scripts/cleanup.ps1
              arguments: -EnvironmentSuffix ${{ parameters.environment }} -WhatIf
            env:
              AI_INFRA_CORE_YAML: $(aiInfraCoreYaml)
              AI_INFRA_ENV_YAML: $(aiInfraEnvYaml)

  - stage: Destroy
    displayName: Destroy resources
    dependsOn: Preview
    jobs:
      - job: Destroy
        displayName: Delete environment resources
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: AzureCLI@2
            displayName: Delete environment resources
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: pscore
              scriptLocation: scriptPath
              scriptPath: scripts/cleanup.ps1
              arguments: -EnvironmentSuffix ${{ parameters.environment }} -Force
            env:
              AI_INFRA_CORE_YAML: $(aiInfraCoreYaml)
              AI_INFRA_ENV_YAML: $(aiInfraEnvYaml)
