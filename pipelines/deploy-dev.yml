trigger: none
pr: none

variables:
  - template: ../variables/dev.yaml

stages:
  - stage: Security
    displayName: Security gate
    jobs:
      - job: StaticSecurityChecks
        displayName: Bicep validation and security scanning
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: PowerShell@2
            displayName: Build and lint Bicep
            inputs:
              targetType: filePath
              filePath: scripts/test.ps1
              arguments: -Mode Static
              pwsh: true
          - task: PowerShell@2
            displayName: Scan generated IaC template
            inputs:
              targetType: filePath
              filePath: scripts/security-scan.ps1
              pwsh: true

  - stage: Planning
    displayName: Plan phase
    dependsOn: Security
    jobs:
      - job: WhatIf
        displayName: Planning
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: AzureCLI@2
            displayName: Planning deployment
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: pscore
              scriptLocation: scriptPath
              scriptPath: scripts/deploy.ps1
              arguments: -EnvironmentSuffix $(environmentSuffix) -WhatIf

  - stage: Deploy
    displayName: Deploy phase
    dependsOn: Planning
    jobs:
      - job: Deploy
        displayName: Deploy
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: AzureCLI@2
            displayName: Deploying resources
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: pscore
              scriptLocation: scriptPath
              scriptPath: scripts/deploy.ps1
              arguments: -EnvironmentSuffix $(environmentSuffix)

  - stage: Validate
    displayName: Validate phase
    dependsOn: Deploy
    jobs:
      - job: PostDeployTests
        displayName: Validate
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: AzureCLI@2
            displayName: Validating deployment
            continueOnError: true
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: pscore
              scriptLocation: scriptPath
              scriptPath: scripts/test.ps1
              arguments: -Mode Validate -EnvironmentSuffix $(environmentSuffix)
