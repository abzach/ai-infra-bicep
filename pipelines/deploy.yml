parameters:
  - name: environment
    displayName: Environment
    type: string
    default: dev
    values:
      - dev
      - uat

trigger: none
pr: none

variables:
  # variables/*.yaml is intentionally untracked, so pipeline variables come from a variable
  # group named ai-infra-<environment>. The group must define:
  #   serviceConnection  - Azure service connection name
  #   vmAdminPassword    - secret VM administrator password
  #   aiInfraCoreYaml    - full contents of variables/core.yaml
  #   aiInfraEnvYaml     - full contents of variables/<environment>.yaml
  - group: ai-infra-${{ parameters.environment }}

stages:
  - stage: Security
    displayName: Security gate
    jobs:
      - job: StaticSecurityChecks
        displayName: Bicep validation and security scanning
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: PowerShell@2
            displayName: Build and lint Bicep
            inputs:
              targetType: filePath
              filePath: scripts/test.ps1
              arguments: -Mode Static
              pwsh: true
          - task: PowerShell@2
            displayName: Scan generated IaC template
            inputs:
              targetType: filePath
              filePath: scripts/scan.ps1
              pwsh: true

  - stage: Planning
    displayName: Plan phase
    dependsOn: Security
    jobs:
      - job: WhatIf
        displayName: Planning
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: AzureCLI@2
            displayName: Planning deployment
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: pscore
              scriptLocation: scriptPath
              scriptPath: scripts/deploy.ps1
              arguments: -EnvironmentSuffix ${{ parameters.environment }} -WhatIf
            env:
              AI_INFRA_CORE_YAML: $(aiInfraCoreYaml)
              AI_INFRA_ENV_YAML: $(aiInfraEnvYaml)

  - stage: Deploy
    displayName: Deploy phase
    dependsOn: Planning
    jobs:
      - job: Deploy
        displayName: Deploy
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: AzureCLI@2
            displayName: Deploying resources
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: pscore
              scriptLocation: scriptPath
              scriptPath: scripts/deploy.ps1
              arguments: -EnvironmentSuffix ${{ parameters.environment }} -VmAdminPassword $env:VM_ADMIN_PASSWORD
            env:
              VM_ADMIN_PASSWORD: $(vmAdminPassword)
              AI_INFRA_CORE_YAML: $(aiInfraCoreYaml)
              AI_INFRA_ENV_YAML: $(aiInfraEnvYaml)

  - stage: Validate
    displayName: Validate phase
    dependsOn: Deploy
    jobs:
      - job: PostDeployTests
        displayName: Validate
        pool:
          vmImage: ubuntu-latest
        steps:
          - task: AzureCLI@2
            displayName: Validating deployment
            continueOnError: true
            inputs:
              azureSubscription: $(serviceConnection)
              scriptType: pscore
              scriptLocation: scriptPath
              scriptPath: scripts/test.ps1
              arguments: -Mode Validate -EnvironmentSuffix ${{ parameters.environment }}
            env:
              AI_INFRA_CORE_YAML: $(aiInfraCoreYaml)
              AI_INFRA_ENV_YAML: $(aiInfraEnvYaml)
